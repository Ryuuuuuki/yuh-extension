<!doctype html><html><head><meta charset="utf-8"><title>Cadastro de parte</title></head><body>
<form onsubmit="window.enviado=true;return false">
<h2>Qualificação da parte</h2>
<p><label for="a">Denominação da pessoa natural</label><br><input id="a" name="f_a"></p>
<p><label for="b">Inscrição no cadastro de pessoas físicas</label><br><input id="b" name="f_b"></p>
<p><label for="c">Ascendente materno</label><br><input id="c" name="f_c"></p>
<p><label for="d">Ascendente paterno</label><br><input id="d" name="f_d"></p>
<p><label for="h">Documento apresentado</label><br><select id="h" name="f_h"><option>Selecione</option><option>Carteira de Identidade</option><option>CNH</option></select></p>
<p><label for="i">Expedido por</label><br><input id="i" name="f_i"> <small>Ex.: SSP/BA — cliente anterior: CARLA ROCHA 111.222.333-44</small></p>
<p><label for="e">Telefone para contato</label><br><input id="e" name="f_e"></p>
<p><label for="g">Nome do cônjuge</label><br><input id="g" name="f_g"></p>
<button>Salvar</button></form></body></html>
