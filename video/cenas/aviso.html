<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Aviso (cartão)</title><link rel="stylesheet" href="comum.css">
<!-- Fundo transparente, canto superior direito. ?tipo=cuidado|ok|info&titulo=…&texto=… -->
<style>
.a{position:absolute;right:70px;top:70px;width:640px;display:flex;gap:24px;background:rgba(27,34,44,.95);border-radius:28px;padding:30px 34px;border:3px solid var(--cor);box-shadow:0 20px 60px rgba(0,0,0,.45);animation:sobe .5s var(--entra) both}
.i{flex:none;width:72px;height:72px;border-radius:50%;background:var(--cor);display:grid;place-items:center;color:#1B222C;font-size:44px;font-weight:700}
b{display:block;font-size:38px;margin-bottom:8px}
p{font-size:30px;color:var(--tinta-2);line-height:1.35}
body.cuidado{--cor:var(--carimbo)} body.ok{--cor:var(--livre-claro)} body.info{--cor:var(--caneta-clara)}
</style></head><body class="info">
<div class="a"><div class="i" id="i">i</div><div><b data-p="titulo">Atenção</b><p data-p="texto"></p></div></div>
<script src="params.js"></script><script>
window.DURACAO = 5;
const t = P("tipo") || "info"; document.body.className = t;
document.getElementById("i").textContent = { cuidado: "!", ok: "✓", info: "i" }[t] || "i";
</script></body></html>
