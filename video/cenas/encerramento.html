<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Encerramento</title><link rel="stylesheet" href="comum.css">
<style>
.c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:46px;text-align:center}
.passos{display:flex;gap:26px;font-size:40px;font-weight:700}
.passos span{background:var(--painel);border:2px solid var(--linha);border-radius:22px;padding:20px 30px;animation:sobe .5s var(--entra) both}
.passos span:nth-child(2){animation-delay:.15s}.passos span:nth-child(3){animation-delay:.3s}.passos span:nth-child(4){animation-delay:.45s}.passos span:nth-child(5){animation-delay:.6s}
.passos span:last-child{background:var(--caneta);border-color:var(--caneta);color:#fff}
.link{font-size:38px;color:var(--tinta-2);animation:aparece .5s 1.2s both}
.link b{color:var(--caneta-clara)}
.marca{font-size:56px;animation:aparece .5s 1.5s both}
</style></head><body class="cheio">
<div class="c">
  <div class="passos"><span>Digitalizou</span><span>Importou</span><span>Preencher</span><span>Conferiu</span><span>Você envia</span></div>
  <p class="link">Celular: <b data-p="link">ryuuuuuki.github.io/yuh-scanner-mobile</b></p>
  <div class="marca"><img src="icone.png" alt=""> Yuh</div>
</div>
<script src="params.js"></script><script>window.DURACAO = 5;</script></body></html>
